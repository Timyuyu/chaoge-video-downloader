<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>超哥视频下载</title>
<style>
  :root {
    --bg: #f6f7fb; --card: #ffffff; --fg: #111827; --muted: #566070;
    --accent: #2f6bff; --accent-2: #4f8cff; --accent-fg: #ffffff;
    --border: #e3e7ef; --ring: rgba(47,107,255,.22);
    --bar-run: #f59e0b; --bar-pause: #94a3b8; --bar-done: #2563eb;
    --ok: #15803d; --err: #b91c1c; --link: #1d4ed8;
    --shadow: 0 1px 2px rgba(16,24,40,.05), 0 12px 28px -18px rgba(16,24,40,.22);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1116; --card: #161b22; --fg: #e9edf3; --muted: #98a4b3;
      --accent: #4f8cff; --accent-2: #69a3ff; --accent-fg: #0b1220;
      --border: #28303c; --ring: rgba(79,140,255,.30);
      --bar-run: #fbbf24; --bar-pause: #64748b; --bar-done: #60a5fa;
      --ok: #4ade80; --err: #f87171; --link: #93c5fd;
      --shadow: 0 1px 2px rgba(0,0,0,.35), 0 14px 30px -20px rgba(0,0,0,.6);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 30px 18px 44px; background: var(--bg); color: var(--fg);
    font: 15px/1.65 "Segoe UI Variable Text", "Segoe UI", system-ui, "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 820px; margin: 0 auto; }
  header {
    display: flex; align-items: center; gap: 14px; margin-bottom: 18px;
    padding: 18px 20px; border: 1px solid var(--border); border-radius: 16px;
    background: linear-gradient(120deg, rgba(47,107,255,.10), rgba(47,107,255,0) 60%), var(--card);
    box-shadow: var(--shadow);
  }
  .logo {
    width: 48px; height: 48px; border-radius: 14px; flex: none;
    background: linear-gradient(160deg, var(--accent-2), var(--accent)); color: var(--accent-fg);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 800; box-shadow: 0 6px 16px -8px rgba(47,107,255,.7);
  }
  h1 { font-size: 23px; margin: 0; letter-spacing: -.2px; font-weight: 800; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 18px; margin-bottom: 14px; box-shadow: var(--shadow);
  }
  .step {
    font-size: 11px; font-weight: 700; color: var(--muted);
    letter-spacing: 1.4px; text-transform: uppercase; margin-bottom: 12px;
  }
  form.row { display: flex; gap: 10px; flex-wrap: wrap; }
  input[type=url], input[type=text] {
    flex: 1 1 300px; min-height: 46px; padding: 10px 14px; font-size: 15px;
    border: 1px solid var(--border); border-radius: 12px;
    background: var(--card); color: var(--fg); min-width: 0;
    transition: border-color .15s, box-shadow .15s;
  }
  input::placeholder { color: var(--muted); opacity: .85; }
  input:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--ring);
  }
  button {
    min-height: 42px; padding: 9px 18px; font-size: 15px; font-weight: 650;
    border: 0; border-radius: 11px; cursor: pointer;
    background: linear-gradient(180deg, var(--accent-2), var(--accent)); color: var(--accent-fg);
    box-shadow: 0 1px 2px rgba(16,24,40,.14), 0 8px 18px -10px rgba(47,107,255,.6);
    transition: transform .12s, filter .12s, background .12s;
  }
  button:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.04); }
  button:active:not(:disabled) { transform: translateY(0); }
  button:disabled { opacity: .5; cursor: default; box-shadow: none; }
  button.ghost {
    background: var(--card); color: var(--fg);
    border: 1px solid var(--border); font-weight: 550; box-shadow: none;
  }
  button.ghost:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button.danger { background: transparent; color: var(--err); border: 1px solid var(--border); box-shadow: none; }
  button.danger:hover:not(:disabled) { border-color: var(--err); }
  button.small { min-height: 32px; padding: 5px 12px; font-size: 13px; border-radius: 9px; }
  select {
    min-height: 42px; padding: 9px 12px; font-size: 14.5px;
    border: 1px solid var(--border); border-radius: 11px;
    background: var(--card); color: var(--fg);
  }
  select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--ring); }
  .media { display: grid; grid-template-columns: 340px 1fr; gap: 18px; }
  @media (max-width: 700px) { .media { grid-template-columns: 1fr; } }
  .preview {
    background: #0b0d10; border: 1px solid var(--border);
    border-radius: 14px; overflow: hidden; min-height: 140px;
  }
  .preview video { width: 100%; display: block; max-height: 420px; }
  .preview img { width: 100%; display: block; max-height: 420px; object-fit: contain; }
  .preview .noframe {
    display: flex; align-items: center; justify-content: center; min-height: 140px;
    color: #cfd6e0; font-size: 13.5px; padding: 14px; text-align: center;
  }
  .mtitle { font-size: 18px; font-weight: 750; letter-spacing: -.1px; margin: 0 0 10px; overflow-wrap: anywhere; }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; }
  .chip {
    font-size: 12.5px; color: var(--muted); background: var(--bg);
    border: 1px solid var(--border); border-radius: 999px; padding: 4px 11px;
  }
  .dlrow { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .hint { color: var(--muted); font-size: 12.5px; margin-top: 10px; overflow-wrap: anywhere; }
  .extracting { color: var(--muted); padding: 22px 6px; }
  .errtext { color: var(--err); font-size: 13.5px; overflow-wrap: anywhere; }
  .taskshead {
    display: flex; justify-content: space-between; align-items: center;
    margin: 22px 4px 12px;
  }
  .taskshead h2 { font-size: 16px; margin: 0; font-weight: 750; letter-spacing: -.1px; }
  .tasks { display: grid; gap: 12px; }
  .tasks:empty::after {
    content: "还没有下载记录。提取视频后点「开始下载」，任务会出现在这里。";
    display: block; color: var(--muted); font-size: 13.5px;
    padding: 18px 6px; border: 1px dashed var(--border); border-radius: 14px;
  }
  .task { padding: 14px 16px 14px 18px; overflow-wrap: anywhere; margin-bottom: 0; position: relative; }
  .task::before {
    content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 3px;
    border-radius: 3px; background: var(--bar-run);
  }
  .task.t-done::before { background: var(--bar-done); }
  .task.t-paused::before { background: var(--bar-pause); }
  .task.t-error::before { background: var(--err); }
  .tname { font-weight: 650; margin: 0 0 4px; overflow-wrap: anywhere; }
  .tmeta { font-size: 12.5px; color: var(--muted); margin-bottom: 8px; overflow-wrap: anywhere; }
  .bar { height: 9px; border-radius: 999px; background: var(--bg); border: 1px solid var(--border); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--bar-run); transition: width .4s; }
  .bar i.pause { background: var(--bar-pause); }
  .bar i.done { background: var(--bar-done); }
  .trow { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .st-done { color: var(--ok); font-weight: 650; }
  .st-err { color: var(--err); font-weight: 650; }
  a.dl { color: var(--link); font-weight: 650; text-decoration: none; }
  a.dl:hover { text-decoration: underline; }
  .modal {
    position: fixed; inset: 0; background: rgba(15,23,42,.45);
    display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 20;
  }
  .modal[hidden] { display: none; }
  .modal .box {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    max-width: 560px; width: 100%; max-height: 78vh; display: flex; flex-direction: column;
    box-shadow: 0 24px 60px -24px rgba(15,23,42,.45);
  }
  .modal .head { padding: 15px 18px; border-bottom: 1px solid var(--border); font-weight: 700; }
  .modal .cur { padding: 11px 18px; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  .dirs { overflow-y: auto; padding: 0 18px; flex: 1; }
  .dirrow {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 14.5px;
  }
  .dirrow .nm { cursor: pointer; color: var(--link); overflow-wrap: anywhere; }
  .dirrow:hover { background: var(--bg); }
  .modal .foot { padding: 13px 18px; display: flex; gap: 10px; justify-content: flex-end; border-top: 1px solid var(--border); }
  .toast {
    position: fixed; right: 18px; bottom: 18px; z-index: 30;
    background: var(--card); color: var(--fg); border: 1px solid var(--border);
    border-left: 4px solid var(--err); border-radius: 12px; padding: 11px 15px;
    max-width: 360px; font-size: 14px; box-shadow: 0 12px 30px -12px rgba(15,23,42,.4);
  }
  @media (prefers-reduced-motion: reduce) {
    button, .bar i { transition: none; }
  }
  .toast[hidden] { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo" aria-hidden="true">超</div>
    <div>
      <h1>超哥视频下载</h1>
      <div class="sub">提取预览后再下载 · 支持 YouTube、Twitter(X)、TikTok、Reddit、Pinterest、Vimeo、Tumblr、AcFun、B站、Instagram 等</div>
    </div>
  </header>

  <section class="card">
    <div class="step">第 1 步 · 粘贴链接并提取</div>
    <form class="row" id="extractForm">
      <input id="url" type="url" placeholder="粘贴视频链接，例如 YouTube / B站 / Instagram 视频页" required aria-label="视频链接">
      <button id="extract" type="submit">提取视频</button>
    </form>
  </section>

  <section class="card" id="mediaCard" hidden>
    <div class="step">第 2 步 · 预览并选择下载方式</div>
    <div id="mediaBody"></div>
  </section>

  <div class="taskshead">
    <h2>下载记录</h2>
    <button id="clearBtn" class="ghost small" type="button">清除已完成/失败</button>
  </div>
  <div class="tasks" id="tasks"></div>
</div>

<div class="modal" id="dirModal" hidden>
  <div class="box">
    <div class="head">选择下载目录</div>
    <div class="cur" id="dirCur"></div>
    <div class="dirs" id="dirList"></div>
    <div class="foot">
      <button class="ghost" id="dirUp" type="button">上一级</button>
      <button class="ghost" id="dirCancel" type="button">取消</button>
      <button id="dirPick" type="button">选择此目录</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>
<script>
const $ = (s) => document.querySelector(s);
const tasksEl = $('#tasks');
const timers = {};
let currentMedia = null;

function esc(s){ const d=document.createElement('div'); d.textContent = (s===null||s===undefined)?'':String(s); return d.innerHTML; }

let toastTimer;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 4000);
}

function fmtSize(n){
  if (!n) return '';
  if (n > 1048576) return (n/1048576).toFixed(1) + ' MB';
  return (n/1024).toFixed(0) + ' KB';
}

/* ---------- 媒体预览 ---------- */
function showMedia(m){
  currentMedia = m;
  const card = $('#mediaCard'); card.hidden = false;
  const body = $('#mediaBody');
  if (m.status === 'queued' || m.status === 'extracting') {
    body.innerHTML = '<div class="extracting">正在提取视频信息并生成预览，请稍候…</div>';
    return;
  }
  if (m.status === 'error') {
    body.innerHTML = '<div class="errtext">' + esc(m.error) + '</div>';
    return;
  }
  const poster = m.thumbnail ? ' poster="' + esc(m.thumbnail) + '"' : '';
  const preview = m.has_preview
    ? '<video controls preload="metadata" playsinline' + poster + ' src="/preview?id=' + m.id + '"></video>'
    : (m.thumbnail ? '<img src="' + esc(m.thumbnail) + '" alt="视频封面" loading="lazy">'
                   : '<div class="noframe">这条视频没有可播放的预览，可直接下载后本地播放</div>');
  const chips = [];
  if (m.source) chips.push(esc(m.source));
  if (m.duration) chips.push('时长 ' + esc(m.duration));
  if (m.uploader) chips.push(esc(m.uploader));
  if (m.view_count) chips.push('播放 ' + m.view_count);
  if (m.has_audio === false) chips.push('⚠ 该视频无音轨');
  const quals = (m.qualities || []).map(q =>
    '<option value="' + esc(q.label) + '"' + (q.label==='最佳画质'?' selected':'') + '>' + esc(q.label) + '</option>').join('');
  body.innerHTML =
    '<div class="media">' +
      '<div class="preview">' + preview + '</div>' +
      '<div>' +
        '<h3 class="mtitle">' + esc(m.title) + '</h3>' +
        '<div class="chips">' + chips.map(c => '<span class="chip">' + c + '</span>').join('') + '</div>' +
        '<div class="dlrow">' +
          '<select id="quality" aria-label="画质选择">' + quals + '</select>' +
          '<button id="dlBtn" type="button">开始下载</button>' +
        '</div>' +
        '<div class="dlrow" style="margin-top:10px">' +
          '<input id="outpath" type="text" aria-label="下载路径" spellcheck="false">' +
          '<button id="browseBtn" class="ghost" type="button">浏览…</button>' +
        '</div>' +
        '<div class="hint">文件将保存到上述目录（自动命名：标题 [视频ID]）。请遵守各站点服务条款与版权规定。</div>' +
      '</div>' +
    '</div>';
  const vid = body.querySelector('.preview video');
  if (vid) {
    let loaded = false;
    vid.addEventListener('loadedmetadata', () => { loaded = true; });
    vid.addEventListener('error', () => previewFallback(body, m));
    // 预览卡住（文件缺失/编码不支持）时，12 秒后换成封面并给出说明，而不是一直空转
    setTimeout(() => { if (!loaded && vid.readyState === 0) previewFallback(body, m); }, 12000);
  }
  $('#dlBtn').addEventListener('click', startDownload);
  $('#browseBtn').addEventListener('click', () => openDirModal($('#outpath').value));
  if (!$('#outpath').value) loadDefaultDir();
}

function previewFallback(body, m){
  const box = body.querySelector('.preview');
  if (!box) return;
  box.innerHTML = (m.thumbnail ? '<img src="' + esc(m.thumbnail) + '" alt="视频封面">' : '') +
                  '<div class="noframe">预览加载失败或超时，可直接下载后本地播放</div>';
}

async function loadDefaultDir(){
  try {
    const r = await fetch('/api/listdirs');
    if (r.ok) $('#outpath').value = (await r.json()).current;
  } catch(e) {}
}

async function pollMedia(id){
  for (let i = 0; i < 90; i++) {
    const r = await fetch('/api/media?id=' + id);
    if (!r.ok) break;
    const m = await r.json();
    if (m.status === 'ready' || m.status === 'error') { showMedia(m); return; }
    await new Promise(res => setTimeout(res, 1200));
  }
  toast('提取超时，请重试');
}

$('#extractForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const url = $('#url').value.trim();
  if (!url) return;
  const btn = $('#extract'); btn.disabled = true;
  try {
    const r = await fetch('/api/extract', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({url})
    });
    const j = await r.json();
    if (!r.ok) { toast(j.error || '提取失败'); return; }
    showMedia({status: 'extracting'});
    pollMedia(j.id);
    $('#url').value = '';
  } finally { btn.disabled = false; }
});

/* ---------- 目录选择 ---------- */
let dirState = null;
async function openDirModal(path){
  const r = await fetch('/api/listdirs?path=' + encodeURIComponent(path || ''));
  if (!r.ok) { toast('目录不存在，已改用默认目录'); return openDirModal(''); }
  dirState = await r.json();
  $('#dirModal').hidden = false;
  renderDirs();
}
function renderDirs(){
  $('#dirCur').textContent = '当前：' + dirState.current;
  $('#dirList').innerHTML = dirState.dirs.map(d =>
    '<div class="dirrow"><span class="nm" data-p="' + esc(d.path) + '">' + esc(d.name) + '</span></div>'
  ).join('') || '<div class="cur">（没有子目录）</div>';
  $('#dirList').querySelectorAll('.nm').forEach(el =>
    el.addEventListener('click', () => openDirModal(el.dataset.p)));
}
$('#dirUp').addEventListener('click', () => { if (dirState && dirState.parent) openDirModal(dirState.parent); });
$('#dirCancel').addEventListener('click', () => $('#dirModal').hidden = true);
$('#dirPick').addEventListener('click', () => {
  if (dirState) $('#outpath').value = dirState.current;
  $('#dirModal').hidden = true;
});

/* ---------- 下载任务 ---------- */
function startDownload(){
  if (!currentMedia || currentMedia.status !== 'ready') { toast('请先提取视频'); return; }
  fetch('/api/download', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      media_id: currentMedia.id,
      quality: $('#quality').value,
      outdir: $('#outpath').value.trim()
    })
  }).then(r => r.json()).then(j => {
    if (j.error) { toast(j.error); return; }
    fetch('/api/task?id=' + j.id).then(r => r.json()).then(t => {
      tasksEl.prepend(taskCard(t));
      timers[t.id] = setInterval(() => pollTask(t.id), 800);
    });
  });
}

function taskCard(t){
  const el = document.createElement('div');
  el.className = 'card task'; el.id = 'task-' + t.id;
  renderTask(el, t);
  return el;
}

function fmtSpeed(bps){
  if (!bps) return '';
  const u = ['B', 'KB', 'MB', 'GB'];
  let n = bps, i = 0;
  while (n >= 1024 && i < 3) { n /= 1024; i++; }
  return (i ? n.toFixed(2) : Math.round(n)) + ' ' + u[i] + '/s';
}

function renderTask(el, t){
  el.className = 'card task ' + (t.status === 'done' ? 't-done' :
                 t.status === 'paused' ? 't-paused' :
                 t.status === 'error' ? 't-error' : 't-run');
  let html = '<div class="tname">' + esc(t.title || t.url) + '</div>' +
             '<div class="tmeta">' + esc(t.outdir || '') + '</div>';
  if (t.status === 'done') {
    html += '<div class="bar"><i class="done" style="width:100%"></i></div>' +
            '<div class="trow"><span class="st-done">已完成' + (t.size ? ' · ' + fmtSize(t.size) : '') + '</span>' +
            '<span><a class="dl" href="/file?id=' + t.id + '">保存文件</a> ' +
            '<button class="ghost small act-open" type="button">打开目录</button> ' +
            '<button class="danger small act-del" type="button">删除记录</button></span></div>';
    if (t.note) html += '<div class="hint">' + esc(t.note) + '</div>';
  } else if (t.status === 'error') {
    html += '<div class="trow"><span class="st-err">失败</span>' +
            '<button class="danger small act-del" type="button">删除记录</button></div>' +
            '<div class="errtext">' + esc(t.error) + '</div>';
  } else if (t.status === 'paused') {
    html += '<div class="bar"><i class="pause" style="width:' + t.progress + '%"></i></div>' +
            '<div class="trow"><span>已暂停 ' + t.progress + '%' +
            (t.speed ? ' · 上次速度 ' + fmtSpeed(t.speed) : '') + '</span>' +
            '<span><button class="ghost small act-pause" type="button">继续</button> ' +
            '<button class="danger small act-del" type="button">删除记录</button></span></div>';
  } else {
    const label = (t.status === 'processing' ? '合并处理中…' :
                   t.status === 'queued' ? '排队中…' : '下载中 ' + t.progress + '%') +
                   (t.speed ? ' · ' + fmtSpeed(t.speed) : '');
    html += '<div class="bar"><i class="run" style="width:' + t.progress + '%"></i></div>' +
            '<div class="trow"><span>' + label + '</span>' +
            '<span><button class="ghost small act-pause" type="button">暂停</button> ' +
            '<button class="danger small act-del" type="button">删除记录</button></span></div>';
  }
  el.innerHTML = html;
  const pz = el.querySelector('.act-pause');
  if (pz) pz.addEventListener('click', () => {
    fetch('/api/' + (t.status === 'paused' ? 'resume' : 'pause'),
          {method:'POST', headers:{'Content-Type':'application/json'},
           body: JSON.stringify({id: t.id})})
      .then(r => r.json())
      .then(j => { if (j && j.id) renderTask(el, j); });
  });
  const del = el.querySelector('.act-del');
  if (del) del.addEventListener('click', () => {
    fetch('/api/delete', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({id: t.id})});
    clearInterval(timers[t.id]); delete timers[t.id];
    el.remove();
  });
  const open = el.querySelector('.act-open');
  if (open) open.addEventListener('click', () => {
    fetch('/api/openfolder', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({path: t.outdir})});
  });
}

async function pollTask(id){
  const r = await fetch('/api/task?id=' + id);
  if (!r.ok) return;
  const t = await r.json();
  const el = document.getElementById('task-' + id);
  if (el) renderTask(el, t);
  if (t.status === 'done' || t.status === 'error') {
    clearInterval(timers[id]); delete timers[id];
  }
}

$('#clearBtn').addEventListener('click', async () => {
  await fetch('/api/clear', {method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'});
  tasksEl.querySelectorAll('.task').forEach(el => {
    if (el.querySelector('.st-done') || el.querySelector('.st-err')) el.remove();
  });
});

/* ---------- 页面载入时恢复状态 ---------- */
(async () => {
  try {
    const r = await fetch('/api/media/latest');
    if (r.ok) {
      const m = await r.json();
      showMedia(m);
      if (m.status === 'queued' || m.status === 'extracting') pollMedia(m.id);
    }
  } catch(e) {}
  const r = await fetch('/api/tasks');
  if (!r.ok) return;
  for (const t of (await r.json()).slice().reverse()) {
    tasksEl.prepend(taskCard(t));
    if (t.status !== 'done' && t.status !== 'error')
      timers[t.id] = setInterval(() => pollTask(t.id), 800);
  }
})();
</script>
</body>
